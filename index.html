.act.done{border-color:var(--ok)}

.act b{display:block}.act small{color:var(--mut)}
.tag{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}
.done .tag{color:var(--ok);font-weight:700}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.q{font-size:22px;font-weight:700;margin:8px 0 14px}
.opts{display:grid;gap:10px}
button.o,button.main,button.back{font:inherit;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:12px;cursor:pointer;font-size:19px}
button.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;margin-top:12px;width:100%}
button.back{font-size:15px;padding:6px 12px;margin-bottom:8px}
a.lnk{display:inline-block;margin-top:10px;padding:10px 14px;border:2px solid var(--acc);border-radius:14px;color:var(--acc);text-decoration:none;font-weight:700}
.mt{margin-top:10px}
input.in{width:100%;font:inherit;padding:10px;margin:6px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
button.o.right{background:var(--ok);border-color:var(--ok);color:#fff}
button.o.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{min-height:26px;margin-top:10px;color:var(--mut)}
.big{font-size:44px;text-align:center;letter-spacing:6px;margin:14px 0;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{font-size:32px;padding:10px 0}
.grid button.sel{background:var(--acc2);border-color:var(--acc2)}
.prog{color:var(--mut);font-size:14px;margin:0}
.ar{font-size:34px;text-align:center;direction:rtl}
.foot{margin-top:18px;font-size:13px;color:var(--mut);text-align:center}
.foot button{font:inherit;font-size:13px;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}

function say(t,l){try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.8;const p=l.slice(0,2),v=speechSynthesis.getVoices().find(v=>v.lang.slice(0,2)==p);if(v)u.voice=v;else if(p=='ar'&&!window._na){window._na=1;alert('This device has no Arabic voice. Add one in Settings, Text-to-speech.')}speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function trace(ch,id){VIEW='l';let i=0;app.innerHTML=`<button class='back' id='bk'>← Back</button><h2>✍️ Trace it</h2><p class='sub' id='tc'></p><canvas id='cv' width='320' height='320' style='width:100%;max-width:340px;border:2px solid var(--line);border-radius:16px;background:var(--card);touch-action:none'></canvas><div style='display:flex;gap:8px;margin-top:8px'><button class='back' id='cl'>Clear</button><button class='main' id='nx2' style='margin:0'>Next ➜</button></div>`;
const cv=$('#cv'),c=cv.getContext('2d'),ink=getComputedStyle(document.documentElement).getPropertyValue('--acc')||'#2a5bd7',fg=getComputedStyle(document.body).color;let dr=false;
const paint=()=>{c.clearRect(0,0,320,320);c.globalAlpha=.18;c.fillStyle=fg;c.font=(ch[i].length>1?'150px':'210px')+' sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ch[i],160,170);c.globalAlpha=1;$('#tc').textContent=(i+1)+' of '+ch.length+': follow the grey letter with your finger'};
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*320/r.width,(e.clientY-r.top)*320/r.height]};
cv.onpointerdown=e=>{dr=true;const[p,q]=pt(e);c.beginPath();c.moveTo(p,q);c.strokeStyle=ink;c.lineWidth=10;c.lineCap='round';c.lineJoin='round';cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!dr)return;const[p,q]=pt(e);c.lineTo(p,q);c.stroke()};cv.onpointerup=()=>{dr=false};
$('#cl').onclick=paint;$('#nx2').onclick=()=>{if(i+1>=ch.length){S.tr=S.tr||{};if(!S.tr[id]){S.tr[id]=1;S.stars++}save();lesson(id)}else{i++;paint()}};$('#bk').onclick=()=>lesson(id);paint()}
function wbuild(ws,id){VIEW='l';ws=shuf(ws).slice(0,6);let i=0;
function show(){if(i>=ws.length){S.wb=S.wb||{};if(!S.wb[id]){S.wb[id]=1;S.stars+=ws.length}save();app.innerHTML=`<div class='panel'><h2>🎉 Great spelling!</h2><button class='main' id='bk'>Back to lesson</button></div>`;$('#bk').onclick=()=>lesson(id);return}
const w=ws[i],pool=shuf(w.split('')),ans=[],ar=/[\u0600-\u06FF]/.test(w),lg=ar?'ar-SA':'en-GB',dr=ar?'direction:rtl;':'';
app.innerHTML=`<button class='back' id='bk'>← Back</button><h2>🔤 Build the word</h2><p class='sub'>${i+1} of ${ws.length}. Tap the speaker, then tap the letters in order.</p><button class='back' id='sp'>🔊 Hear the word</button><div class='big' id='ln' style='min-height:60px;${dr}'></div><div class='grid' id='lt' style='${dr}'>${pool.map((l,j)=>`<button class='o' data-j='${j}'>${l}</button>`).join('')}</div><button class='back' id='un' style='margin-top:8px'>↩ Undo</button><p class='fb' id='fb'></p>`;
const draw=()=>{$('#ln').textContent=ans.map(j=>pool[j]).join('')};$('#sp').onclick=()=>say(w,lg);setTimeout(()=>say(w,lg),300);
app.querySelectorAll('#lt button').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(ans.includes(j))return;ans.push(j);b.disabled=true;draw();if(ans.length==w.length){if(ans.map(k=>pool[k]).join('')==w){$('#fb').textContent='✅ Yes! '+w;setTimeout(()=>{i++;show()},900)}else{$('#fb').textContent='Not quite. Try again.';setTimeout(show,900)}}});
$('#un').onclick=()=>{const j=ans.pop();if(j!==undefined){app.querySelector("#lt button[data-j='"+j+"']").disabled=false;draw()}};$('#bk').onclick=()=>lesson(id)}
show()}
function sbuild(its,id,rtl){VIEW='l';its=shuf(its).slice(0,5);let i=0;
function show(){if(i>=its.length){S.sb=S.sb||{};if(!S.sb[id]){S.sb[id]=1;S.stars+=its.length}save();app.innerHTML=`<div class='panel'><h2>🎉 Well built!</h2><button class='main' id='bk'>Back to lesson</button></div>`;$('#bk').onclick=()=>lesson(id);return}
const s=its[i][0],tr=its[i][1],pool=shuf(s.split(' ')),ans=[],d=rtl?'direction:rtl;':'';
app.innerHTML=`<button class='back' id='bk'>← Back</button><h2>🧱 Build the sentence</h2><p class='sub'>${i+1} of ${its.length}. ${tr?'Meaning: '+esc(tr):''}</p><div class='panel' id='ln' style='min-height:60px;font-size:24px;${d}'></div><div style='display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;${d}' id='lt'>${pool.map((w,j)=>`<button class='o' data-j='${j}' style='font-size:20px'>${esc(w)}</button>`).join('')}</div><button class='back' id='sp' style='margin-top:8px'>🔊 Hear it</button> <button class='back' id='un' style='margin-top:8px'>↩ Undo</button><p class='fb' id='fb'></p>`;
const draw=()=>{$('#ln').textContent=ans.map(j=>pool[j]).join(' ')};$('#sp').onclick=()=>say(s,rtl?'ar-SA':'en-GB');
app.querySelectorAll('#lt button').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(ans.includes(j))return;ans.push(j);b.disabled=true;draw();if(ans.length==pool.length){if(ans.map(k=>pool[k]).join(' ')==s){$('#fb').textContent='✅ Correct!';setTimeout(()=>{i++;show()},900)}else{$('#fb').textContent='Not quite. Try again.';setTimeout(show,900)}}});
$('#un').onclick=()=>{const j=ans.pop();if(j!==undefined){app.querySelector("#lt button[data-j='"+j+"']").disabled=false;draw()}};$('#bk').onclick=()=>lesson(id)}
show()}

$('#bk').onclick=window.LB||learnHome;app.querySelectorAll('a[data-l]').forEach(a=>a.onclick=e=>{e.preventDefault();lesson(a.dataset.l)});
const L2=x.m=='ara'?'ar-SA':'en-GB';app.querySelectorAll('.panel b').forEach(b=>{b.style.cursor='pointer';b.onclick=()=>say(b.dataset.say||b.textContent,L2)});const q1=$('#b1');if(q1)q1.onclick=()=>trace(x.tr,id);const q2=$('#b2');if(q2)q2.onclick=()=>wbuild(x.wb,id);const q3=$('#b3');if(q3)q3.onclick=()=>sbuild(x.sb,id,x.m=='ara');
$('#pq').onclick=()=>quiz('L:'+id,(x.qs.length>5?shuf(x.qs).slice(0,5):x.qs).map(s=>{const a=typeof s=='string'?(()=>{const p=s.split('~');return[p[0],p[1],p.slice(2),'Answer: '+p[1]]})():[s[0],s[1],s[2],s[3]||'Answer: '+s[1]];const m=mk(a[0],a[1],a[2],a[3]);m.cat=MODS.find(k=>k[0]==x.m)[2];m.x=a;return m}),x.t)}
/* English phonics path */
addL("e1","eng","Letter sounds: s a t p i n",1,2,"","Letters make sounds. Say the sound, not the name. <b>s</b> says sss like snake. <b>a</b> says aaa like apple. <b>t</b> says t like tap. <b>p</b> says p like pan. <b>i</b> says i like igloo. <b>n</b> says nnn like nest.",["Which sound does the letter s make?~sss like snake~mmm like moon~t like tap~nnn like nest","Which word starts with the sound p?~pan~sun~net~tap","Which word starts with the sound t?~tap~pan~sun~net"]);
addL("e2","eng","Letter sounds: m d g o",1,2,"e1","<b>m</b> says mmm like moon. <b>d</b> says d like dog. <b>g</b> says g like goat. <b>o</b> says o like orange.",["Which word starts with the sound g?~goat~moon~dog~sun","Which word starts with the sound m?~moon~dog~goat~tap","Which letter says d like dog?~d~m~g~o"]);
addL("e3","eng","Blending sounds into words",1,2,"e1,e2","Say each sound, then slide them together: c - a - t becomes <b>cat</b>. This is called blending.",["Blend the sounds: s - i - t~sit~sat~set~sip","Blend the sounds: p - a - n~pan~pin~pen~nap","Blend the sounds: d - o - g~dog~dig~dug~dot"]);
addL("e4","eng","Two letters, one sound: sh ch th",1,3,"e3","<b>sh</b> says shh like ship. <b>ch</b> says ch like chip. <b>th</b> says th like thin. These are called digraphs.",["Which word starts with the sound sh?~ship~chip~thin~sip","Which word starts with the sound ch?~chip~ship~thin~tip","Which word has the sound th?~thin~chin~shin~tin"]);
addL("e5","eng","Blends: bl cl st",1,3,"e3","In a blend, you hear both sounds quickly: <b>bl</b>ack, <b>cl</b>ap, <b>st</b>op.",["Which word starts with st?~stop~top~shop~chop","Which word starts with cl?~clap~cap~lap~nap","Which word starts with bl?~black~back~lack~pack"]);
addL("e6","eng","Making a sentence",1,3,"e3","A sentence says a complete idea. It starts with a <b>capital letter</b> and ends with a <b>full stop</b>. Example: The cat sat. Next: learn about {{e7}}.",["Which is a complete sentence?~The dog ran.~The dog~Ran fast~A big dog","Which sentence is written correctly?~The sun is hot.~the sun is hot.~The sun is hot~the Sun is hot","What do we put at the end of a sentence?~A full stop~A comma~A star~Nothing"]);
addL("e7","eng","Nouns: naming words",2,4,"e6","A <b>noun</b> names a person, animal, place or thing: girl, lion, Dubai, table. Next: {{e8}}.",["Which word is a noun?~lion~jump~quickly~happy","Which word is a noun?~Dubai~sing~fast~green","Which is a naming word?~table~run~soft~slowly"]);
addL("e8","eng","Verbs: action words",2,4,"e7","A <b>verb</b> tells what someone does: jump, read, sing, eat. Every sentence needs a verb.",["Which word is a verb?~jump~table~blue~lion","Find the verb: Fatima reads a book.~reads~Fatima~book~a","Which word is an action word?~sing~song~soft~sun"]);
addL("e9","eng","Adjectives: describing words",3,5,"e7","An <b>adjective</b> describes a noun: a <b>tall</b> tree, a <b>red</b> balloon. See also {{e7}}.",["Which word is an adjective?~tall~run~Dubai~quickly","Find the adjective: a red balloon~red~balloon~a~the","Which word describes a lion?~brave~jump~run~eat"]);
/* Arabic (Emirati style, English-speaking beginner) */
addL("a1","ara","How Arabic works",1,12,"","Arabic is read from <b>right to left</b>. The alphabet has <b>28 letters</b>. Letters usually join together inside a word, so their shape changes a little.",["Which direction is Arabic read?~Right to left~Left to right~Top to bottom~Bottom to top","How many letters are in the Arabic alphabet?~28~26~24~30","In a word, Arabic letters usually ...~join together~stay separate~float up~turn red"]);
addL("a2","ara","Letters: ا ب ت",1,12,"a1","<b>ا</b> (alif) says aa. <b>ب</b> (baa) says b like ball. <b>ت</b> (taa) says t like top.",["Which letter says b like ball?~ب~ا~ت","Which letter is alif?~ا~ب~ت","How do we say ت?~taa~baa~alif"]);
addL("a3","ara","Letters: ث ج ح",1,12,"a2","<b>ث</b> (thaa) says th like think. <b>ج</b> (jeem) says j like jam. <b>ح</b> (haa) is a soft, breathy h from the throat.",["Which letter says th as in think?~ث~ج~ح","Which letter says j as in jam?~ج~ث~ح","What is the name of ح?~haa~jeem~thaa"]);
addL("a4","ara","Short vowels",1,12,"a2","Small marks give vowels. <b>بَ</b> (fatha) = ba. <b>بِ</b> (kasra) = bi. <b>بُ</b> (damma) = bu.",["How do you read بَ?~ba~bi~bu","How do you read بِ?~bi~ba~bu","How do you read بُ?~bu~ba~bi"]);
addL("a5","ara","First words",1,12,"a4","<b>كتاب</b> (kitaab) = book. <b>باب</b> (baab) = door. <b>بيت</b> (bayt) = house.",["What does باب (baab) mean?~door~book~house","What does كتاب (kitaab) mean?~book~door~house","What does بيت (bayt) mean?~house~door~book"]);
addL("a6","ara","Greetings in the UAE",1,12,"a5","<b>مرحبا</b> (marhaba) = hello. <b>هلا</b> (hala) = friendly Gulf hello. <b>السلام عليكم</b> (as-salaamu alaykum) = peace be upon you. <b>شكرا</b> (shukran) = thank you. <b>مع السلامة</b> (ma'a salama) = goodbye.",["What does شكرا (shukran) mean?~Thank you~Hello~Goodbye","Which means goodbye?~مع السلامة~مرحبا~شكرا","Which is a friendly Gulf hello?~هلا (hala)~شكرا (shukran)~مع السلامة (ma'a salama)"]);
addL("a7","ara","Numbers 1 to 5",1,12,"a5","<b>واحد</b> (waahid) 1, <b>اثنان</b> (ithnaan) 2, <b>ثلاثة</b> (thalaatha) 3, <b>أربعة</b> (arba'a) 4, <b>خمسة</b> (khamsa) 5.",["What is واحد (waahid)?~1~2~3","What is ثلاثة (thalaatha)?~3~4~5","What is خمسة (khamsa)?~5~4~3"]);
addL("a8","ara","Your first sentences",1,12,"a5,a6","<b>هذا كتاب</b> (haadha kitaab) = This is a book. For a feminine word: <b>هذه مدرسة</b> (haadhihi madrasa) = This is a school.",["What does هذا كتاب mean?~This is a book~This is a door~This is a house","Which means This is a school?~هذه مدرسة~هذا كتاب~هذا باب","Which word means school?~مدرسة~كتاب~باب"]);
/* Maths by grade */
addL("m1","mat","Counting to 20",1,1,"","Count objects one by one. After 14 comes 15. The bigger number is further along the number line.",["What comes after 14?~15~13~16~24","Which is bigger?~12~9~8~7","What is 7 + 1?~8~6~9~71"]);
addL("m2","mat","Adding and subtracting",1,2,"m1","Adding joins groups. Subtracting takes away. 8 + 7 = 15, and 15 − 6 = 9.",["8 + 7 = ?~15~14~16~13","15 − 6 = ?~9~8~10~11","12 + 5 = ?~17~16~18~7"]);
addL("m3","mat","Place value",2,3,"m2","In 345: 3 is hundreds (300), 4 is tens (40), 5 is ones (5).",["In 345, the digit 4 is in the ___ place.~tens~ones~hundreds~thousands","What is the value of 7 in 972?~70~7~700~97","400 + 30 + 2 = ?~432~4032~342~423"]);
addL("m4","mat","Times tables",3,4,"m2","Tables are repeated adding. 5s end in 0 or 5. 9s: the digits add to 9 (18, 27, 36). 10s add a zero. Learn up to 12 x 12.",["6 x 7 = ?~42~36~48~13","9 x 8 = ?~72~81~64~63","12 x 4 = ?~48~44~52~16"]);
addL("m5","mat","Fractions",3,6,"m4","A fraction is part of a whole. 1/2 is half, 1/4 is a quarter. 2/4 = 1/2. Division helps: see {{m4}}.",["What is 1/2 of 18?~9~8~6~36","Which is bigger?~1/2~1/4~1/8~1/10","2/4 is the same as ...~1/2~1/4~2/8~4/2"]);
addL("m6","mat","Percentages",5,8,"m5","Percent means out of 100. 50% = 1/2, 25% = 1/4, 10% = 1/10. See {{m5}}.",["50% of 80 = ?~40~50~30~20","25% of 200 = ?~50~25~100~75","10% of 350 = ?~35~3.5~350~70"]);
addL("m7","mat","Algebra basics",6,9,"m6","A letter stands for an unknown number. Solve by doing the same thing to both sides. If x + 7 = 12, then x = 5.",["x + 7 = 12. What is x?~5~19~4~7","3x = 21. What is x?~7~18~63~24","2x + 3 = 11. What is x?~4~7~5~14"]);
addL("m8","mat","Pythagoras theorem",8,10,"m7","In a right-angled triangle: <b>a² + b² = c²</b> where c is the longest side (hypotenuse). A 3-4-5 triangle works: 9 + 16 = 25.",["Legs 3 and 4. Hypotenuse = ?~5~7~6~12","Legs 5 and 12. Hypotenuse = ?~13~17~15~60","Legs 6 and 8. Hypotenuse = ?~10~14~12~48"]);
addL("m9","mat","Quadratic equations",10,12,"m7","For ax² + bx + c = 0: <b>x = (−b ± √(b² − 4ac)) / 2a</b>. The part b² − 4ac is the discriminant. Competitive tip: factorise first when possible.",["The roots of x² − 5x + 6 = 0 are ...~2 and 3~1 and 6~-2 and -3~5 and 1","The discriminant of x² − 4x + 4 is ...~0~16~4~-4","The roots of x² − 9 = 0 are ...~3 and -3~9 and -9~0 and 9~3 only"]);
addL("m10","mat","Trigonometry basics",10,12,"m8","sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent. Key values: sin 30° = 1/2, cos 60° = 1/2, tan 45° = 1.",["sin 30° = ?~1/2~1~0~√3/2","cos 60° = ?~1/2~1~0~√3/2","tan 45° = ?~1~0~1/2~√3"]);
addL("m11","mat","Differentiation basics",11,12,"m9","Rule: d/dx (xⁿ) = n xⁿ⁻¹. A constant gives 0. Competitive tip: JEE questions use this rule constantly.",["d/dx of x³ = ?~3x²~x²~3x~x⁴","d/dx of 5x² = ?~10x~5x~25x~2x","d/dx of 7 = ?~0~7~1~x"]);
/* Science by grade */
addL("s1","sci","Living and non-living things",1,2,"","Living things grow, need food and water, and have babies. Plants and animals are living. Rocks and water are non-living.",["Which is living?~tree~stone~chair~water","Which is non-living?~rock~dog~bird~flower","Living things need ...~food and water~paint~plastic~batteries"]);
addL("s2","sci","States of matter",3,5,"s1","Matter is solid, liquid or gas. Solids keep their shape. Liquids flow. Gases spread out. Ice melts to water; water boils to steam.",["Ice melting turns into a ...~liquid~gas~solid~light","Which has a fixed shape?~solid~liquid~gas~steam","Boiling water gives ...~steam~ice~sand~oil"]);
addL("s3","sci","Photosynthesis",4,7,"s2","Plants make food using sunlight, water and carbon dioxide. This happens in leaves, using chlorophyll. Plants release oxygen.",["Plants make food using ...~sunlight, water and carbon dioxide~soil only~moonlight~sugar","Which gas do plants release?~oxygen~carbon dioxide~helium~smoke","Where does photosynthesis happen?~leaves~roots~seeds~bark"]);
addL("s4","sci","Force and Newton's laws",6,10,"s2","1st law: things keep moving or stay still unless a force acts (inertia). 2nd law: <b>F = m x a</b>. 3rd law: every action has an equal and opposite reaction.",["F = m x a. If m = 2 kg and a = 3 m/s², F = ?~6 N~5 N~1.5 N~9 N","A rocket moves up because of ...~action and reaction~inertia only~magnetism~sound","A rolling ball stops because of ...~a force like friction~its colour~its name~no reason"]);
addL("s5","sci","Atoms",8,10,"s2","Atoms have protons (+), neutrons (neutral) and electrons (−). The atomic number is the number of protons. Carbon has 6.",["Which particle is negative?~electron~proton~neutron~nucleus","The atomic number of carbon is ...~6~12~4~8","Neutrons are ...~neutral~positive~negative~light"]);
addL("s6","sci","Electric circuits and Ohm's law",8,12,"s5","<b>V = I x R</b>. Voltage V is in volts, current I in amperes, resistance R in ohms. Competitive tip: practise rearranging this formula.",["V = 10 V, R = 5 ohm. I = ?~2 A~50 A~0.5 A~15 A","The unit of resistance is the ...~ohm~volt~ampere~watt","Current is measured in ...~amperes~volts~ohms~joules"]);
addL("s7","sci","Chemical reactions",9,10,"s5","In a reaction, atoms rearrange to make new substances. Balanced example: <b>2H₂ + O₂ → 2H₂O</b>. Atoms are never lost.",["Which is a chemical change?~burning paper~melting ice~cutting paper~mixing sand and water","Rusting of iron is a ...~chemical change~physical change~no change~state change","How many hydrogen atoms are in 2H₂O?~4~2~3~6"]);
addL("s8","sci","The cell",6,10,"s1","Cells are the building blocks of life. The nucleus controls the cell. Mitochondria release energy. Plant cells also have a cell wall and chloroplasts.",["Which part is the powerhouse of the cell?~mitochondria~nucleus~cell wall~vacuole","Which part controls the cell?~nucleus~cell wall~chloroplast~membrane only","Which is found in plant cells but not animal cells?~cell wall~nucleus~mitochondria~cytoplasm"]);
/* Money stories */
addL("f1","fin","Story: Zara and the piggy bank",1,5,"","Zara wants a toy that costs 50 dirhams. Her uncle gives her 10 dirhams every week. She puts it in her piggy bank and does not spend it on sweets. Saving means keeping money for later. A <b>need</b> is something you must have, like water. A <b>want</b> is extra, like a toy.",["How much will Zara have after 3 weeks?~30 dirhams~10 dirhams~50 dirhams~13 dirhams","How many weeks to save 50 dirhams at 10 a week?~5~3~10~50","Which is a need?~Water~A new toy~Sweets~A game"]);
addL("f2","fin","Story: Zara's trip and currencies",3,8,"f1","Zara flies to India and America. Every country has its own money: dirham (AED), rupee (INR), dollar (USD). To swap one for another she uses an <b>exchange rate</b>. The UAE dirham is fixed to the dollar at about 3.67 dirhams per dollar. Other rates change daily.",["Which is the UAE currency?~Dirham~Rupee~Dollar~Yen","An exchange rate tells us ...~the price of one currency in another~the weather~the time~the distance","About how many dirhams is 2 US dollars?~7.3~2~3.6~20"]);
addL("f3","fin","Story: The bank and interest",4,8,"f1","Zara's parents take her to a bank. The bank keeps her money safe and pays her a little extra called <b>interest</b>. Simple interest = principal x rate x time / 100. A loan works the other way: you pay interest to borrow.",["A bank pays you ___ for saving.~interest~tax~fines~rent","Interest on 200 at 10% for 1 year = ?~20~10~200~2","When you borrow money, you pay ...~interest~nothing~a gift~a medal"]);
addL("f4","fin","Story: The lemonade company and shares",6,12,"f3","Ali starts a lemonade company and splits it into 100 <b>shares</b>. A friend buys 10 shares, so owns 10% of the company. If the company earns profit, it may pay a <b>dividend</b>. Share prices go up and down. They are traded on a stock exchange.",["Owning 10 of 100 shares means you own ...~10%~1%~100%~0.1%","A share is a part of ...~a company~a bank loan~a tax~a coin","Money paid to shareholders from profits is a ...~dividend~fine~loan~bill"]);
addL("f5","fin","Story: The fruit basket and ETFs",7,12,"f4","Instead of buying one fruit, Sara buys a whole basket. An <b>ETF</b> (Exchange-Traded Fund) is a basket of many shares you buy at once. If one fruit goes bad, the others still help. This is <b>diversification</b>: do not put all your eggs in one basket.",["ETF stands for ...~Exchange-Traded Fund~Easy Trade Fund~Early Tax Form~Electronic Trading File","Why buy a basket of shares?~It spreads risk~It guarantees profit~It is free~It avoids all losses","ETFs are traded on a ...~stock exchange~farm~playground~library"]);
addL("f6","fin","Story: Digital coins and crypto",7,12,"f5","A <b>cryptocurrency</b> is digital money recorded on a blockchain, such as Bitcoin. No bank controls it. Prices can rise and fall very sharply and nothing is guaranteed. Many scams use crypto. This is education, not investment advice. Always talk to a trusted adult first.",["Bitcoin is a ...~cryptocurrency~bank~shop~coin from the mint","Crypto prices can ...~rise and fall sharply~never change~only rise~only fall","What is a wise first step?~Learn and ask a trusted adult~Send money to a stranger~Share your password~Borrow to buy"]);
addL("f7","fin","Story: Risk and reward",6,12,"f4","Rani learns that an investment with a chance of high reward also has a higher <b>risk</b> of loss. A safe bank deposit grows slowly. An <b>emergency fund</b> is money kept aside for surprises. Spread your money across different things: {{f5}}.",["Higher possible reward usually means ...~higher risk~no risk~lower price~free gifts","An emergency fund is for ...~unexpected needs~holidays only~games~gifts","Diversification means ...~spreading money across different things~spending it all~hiding it~lending it to friends"]);
addL("f8","fin","Story: Scam alert",4,12,"f1","A message says: Send us money today and we guarantee to double it! This is a <b>scam</b>. No honest investment can guarantee big profits. Never share your PIN or OTP, and tell an adult about suspicious messages.",["A promise to guarantee double money is ...~a red flag~great news~normal~a bank rule","You should never share your ...~PIN or OTP~name only~favourite colour~shoe size","If you get a strange money message, you should ...~tell a trusted adult~reply with details~click the link~send money"]);
fetch('lessons.json').then(r=>r.json()).then(ls=>{Object.keys(LES).forEach(k=>{if(LES[k].m=='eng'||LES[k].m=='ara')delete LES[k]});ls.forEach(x=>{addL(x.id,x.m,x.t,x.g1,x.g2,x.pre,x.body,x.qs);const y=LES[x.id];['tr','wb','sb'].forEach(k=>{if(x[k])y[k]=x[k]})})}).catch(()=>{});
const BADGES=[['🌱','First steps',()=>Object.keys(S.done||{}).length>=1],['🔥','3-day streak',()=>(S.streak||0)>=3],['🔥','7-day streak',()=>(S.streak||0)>=7],['⭐','100 stars',()=>(S.stars||0)>=100],['🏆','500 stars',()=>(S.stars||0)>=500],['🧠','Memory master',()=>L('mem')>=4],['🥷','Number ninja',()=>L('math')>=3],['🧩','Puzzle pro',()=>L('logic')>=3],['🌍','Topic explorer',()=>Object.keys(S.stats||{}).length>=5],['💪','Comeback kid',()=>(S.fixed||0)>=5]];
function profile(){VIEW='f';const p=PR(),u=(USER&&USER.user_metadata)||{},age=p.dob?Math.floor((Date.now()-new Date(p.dob))/315576e5):p.age;
S.ach=S.ach||{};BADGES.forEach(b=>{if(b[2]()&&!S.ach[b[1]])S.ach[b[1]]=key});save();
const lv=(k,t)=>`<p style='display:flex;align-items:center;gap:8px;margin:8px 0'><b style='flex:1'>${t}</b><button class='back' data-lv='${k}' data-d='-1'>−</button> Level ${L(k)} <button class='back' data-lv='${k}' data-d='1'>+</button></p>`;
app.innerHTML=`<button class='back' id='bk'>← Back</button><h1>${p.emoji} ${esc(p.name)}</h1><p class='sub'>Grade ${p.grade}${age?' · Age '+age:''}</p>
<div class='stats'><div class='stat'><b>🔥 ${S.streak||0}</b><span>streak</span></div><div class='stat'><b>⭐ ${S.stars||0}</b><span>stars</span></div><div class='stat'><b>${Object.keys(S.log||{}).length}</b><span>days played</span></div></div>
<div class='panel'><b>🏅 Achievements</b>${BADGES.map(b=>S.ach[b[1]]?`<p style='margin:6px 0'>${b[0]} ${b[1]} <small>(${S.ach[b[1]]})</small></p>`:`<p style='margin:6px 0;opacity:.5'>🔒 ${b[1]}</p>`).join('')}</div>
<div class='panel mt'><b>Difficulty</b><p><label><input type='checkbox' id='mn' ${S.manual?'checked':''}> Keep my levels (turn off auto-adjust)</label></p>${lv('math','Maths')}${lv('logic','Puzzles')}${lv('mem','Memory')}<small>Changes apply to the next round straight away.</small></div>
<button class='main' id='rv'>🔁 Review mistakes (${(S.missed||[]).length})</button>
${USER?`<div class='panel mt'><b>Parent account</b><p>${esc(u.name||'')}<br>${esc(USER.email)}<br>${esc(u.phone||'')}</p><button class='back' id='lo'>Log out</button></div>`:''}`;
$('#bk').onclick=home;$('#rv').onclick=review;
$('#mn').onchange=e=>{S.manual=e.target.checked;save()};
app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{const k=b.dataset.lv;S.lv[k]=Math.min(4,Math.max(1,L(k)+(+b.dataset.d)));S.manual=true;save();profile()});
const lo=$('#lo');if(lo)lo.onclick=async()=>{await sb.auth.signOut();USER=null;PF=[];CUR=null;authScreen('in')}}
function review(){VIEW='r';const m=S.missed||[];app.innerHTML=`<button class='back' id='bk'>← Back</button><h2>Review mistakes</h2>${m.length?m.map(x=>`<div class='panel mt'><small>${esc(x.cat||'')}</small><p style='margin:4px 0'>${esc(x.x[0].replace(/<[^>]*>/g,' '))}</p><b style='color:var(--ok)'>${esc(x.x[1])}</b><br><small>${esc(x.x[3]||'')}</small></div>`).join(''):'<p class="sub">No mistakes waiting. 🎉</p>'}${m.length?`<button class='main' id='pr'>Practise these now</button>`:''}`;
$('#bk').onclick=profile;if(m.length)$('#pr').onclick=()=>quiz('rev',m.slice(0,8).map(x=>toQ({x:x.x,cat:x.cat,retry:true})),'Review mistakes')}
function authScreen(mode){VIEW='a';const su=mode=='up';
app.innerHTML=`<h1>🧠 Brain Quest</h1><p class='sub'>${su?'Create a parent account':'Welcome back! Log in to continue.'}</p>${su?`<input class='in' id='pn' placeholder='Parent name'><p class='sub' style='margin:4px 0'>Date of birth</p><input class='in' id='pd' type='date'><input class='in' id='pp' type='tel' placeholder='Contact number'>`:''}<input class='in' id='pe' type='email' placeholder='Email'><input class='in' id='pw' type='password' placeholder='Password (6+ characters)'><button class='main' id='go'>${su?'Create account':'Log in'}</button><p class='fb' id='ae'></p><button class='back' id='tg'>${su?'I already have an account':'New here? Create an account'}</button>`;
$('#tg').onclick=()=>authScreen(su?'in':'up');
$('#go').onclick=async()=>{const m=$('#ae');m.textContent='Please wait…';const e=$('#pe').value.trim(),p=$('#pw').value;
const r=su?await sb.auth.signUp({email:e,password:p,options:{data:{name:$('#pn').value.trim(),dob:$('#pd').value,phone:$('#pp').value.trim()}}}):await sb.auth.signInWithPassword({email:e,password:p});
if(r.error){m.textContent=r.error.message;return}if(!r.data.session){m.textContent='Check your email to confirm your address, then log in.';return}USER=r.data.user;afterLogin()}}
async function afterLogin(){const r=await sb.from('children').select('*').order('created_at');PF=(r.data||[]).map(c=>({id:c.id,name:c.name,emoji:c.emoji||'🦁',grade:c.grade||3,age:(c.grade||3)+6,dob:c.dob,remote:c.data}));LS('bqp',JSON.stringify(PF));picker()}
if(sb)sb.auth.getSession().then(r=>{if(r.data.session){USER=r.data.session.user;afterLogin()}else authScreen('in')});else picker();
(async()=>{try{if(!window.claude)return;const d=await claude.use('db');if(!d)return;DB=d;watch();
d.doc('profiles/list').onSnapshot(async sn=>{let r=null;if(sn.exists){try{r=JSON.parse(sn.data().s)}catch(e){}}
if(r&&r.length){const m=[...r];PF.forEach(p=>{if(!m.find(x=>x.id==p.id))m.push(p)});const grew=m.length>r.length;PF=m;LS('bqp',JSON.stringify(PF));if(grew)savePF()}
else if(!PF.length){const m=await d.doc('progress/main').get();if(m.exists){PF=[{id:'main',name:'My child',emoji:'🦁',grade:3,age:9}];savePF()}}else savePF();
if(VIEW=='p')picker()},()=>{})}catch(e){}})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
